name = "RiemannProof"
version = "0.1.0"
keywords = ["math"]
# `PnpProof` is not included in this repository snapshot, so it cannot be a
# default build target.  Keep the complete proof and book targets buildable.
# `Layout` (GPU_FEDERATION_PLAN T2.1) is pure-core Lean: the StateDictionary
# layout-bijectivity and bank-conflict swizzle-impossibility certificates,
# exported via lean4export and re-verified by nanoda in unfer (S29/S31).
defaultTargets = ["BookProof", "Book", "Singularity", "Layout"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 10
# NOTE: was `3`; raised to 10 during investigation of the 26-chapter root manual build.
# The actual 26-include failure was a Verso bug (unannotated sub-parts array in
# `FinishedPart.toSyntax`), now fixed by patches/verso-0001-annotate-subparts.patch —
# see BOOK_PROOF_PLAN.md Priority 4. This option is kept at 10 (harmless).
# autoImplicit = false  # DISABLED: not needed for the book build (kept default).
# experimental.module = true  # DISABLED: breaks the Verso book build and is not needed
# (the book uses plain code blocks; verification is via `lake build BookProof`).

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.28.0"

[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "verso-v4.28.0"

[[require]]
name = "MD4Lean"
git = "https://github.com/acmepjz/md4lean"
rev = "7e097e9a076d5fbe48aa39aceee871af0d011101"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "55c8532eb21ec9f6d565d51d96b8ca50bd1fbef3"

[[lean_lib]]
name = "UsedRoute"

[[lean_lib]]
name = "UnusedRoute"

[[lean_lib]]
name = "RandomMap"

[[lean_lib]]
name = "PnpProof"

[[lean_lib]]
name = "BookProof"

[[lean_lib]]
name = "Singularity"

[[lean_lib]]
name = "Book"

[[lean_lib]]
name = "Layout"

[[lean_lib]]
name = "GapCertificate"

# Compatibility aggregator for the Riemann-route modules (`RiemannProof.*`).
[[lean_lib]]
name = "RiemannProof"

# `#print axioms` audit scripts.  Never a default target: they are re-run on
# demand and would otherwise force a full rebuild of everything they audit.
[[lean_lib]]
name = "Audits"

# Scratch/working library for new developments.  A module placed in `Work/`
# compiles only its own import cone, so a new proof that needs one chapter
# costs one chapter, not the whole book.  Not a default target.
[[lean_lib]]
name = "Work"

# Prove2.me downloads converted to Lean 4.28.0 (BOOKPROOF_SPLIT_PLAN.md Phase 1.5,
# landing in `converted/` per the 2026-10-18 conversion request).  `Prove2me` is the
# aggregator of the compiled conversions; `Prove2me.Audit` is the `#print axioms`
# audit.  Files under `converted/blocked/` are not modules of this library: they
# need platform `Definitions.*` / `Theorems.*` modules that were not downloaded.
# (Kept above the generated part stanzas: `--write-lakefile` rewrites to the end.)
[[lean_lib]]
name = "Prove2me"
srcDir = "converted"
roots = ["Prove2me", "Prove2me.Audit"]
leanOptions = { weak.linter.mathlibStandardSet = false }

# prove2.me platform library (`Definitions.Def_*`, `Theorems.Thm_*`) that the
# downloaded solutions import, supplied as `Downloads/_deps/` (2026-10-19) and
# converted by `scripts/prove2me_deps_convert.py`.  Module names are kept so the
# solutions' imports resolve unchanged.
# `lake build Prove2mePlatform` builds the aggregators `Definitions` and `Theorems`
# (every platform module except the unreferenced `Def_OAIE3v2B*` chain, see
# `converted/README.md`).
[[lean_lib]]
name = "Prove2mePlatform"
srcDir = "converted"
roots = ["Definitions", "Theorems"]
leanOptions = { weak.linter.mathlibStandardSet = false }

[[lean_exe]]
name = "book"
root = "BookMain"

# ---------------------------------------------------------------------------
# Independent parts of `BookProof`, one Lake target each.
#
# Two modules are *dependent* when one imports the other, directly or
# transitively; the connected components of that relation are the parts of the
# development that have no Lean dependency on each other and can therefore be
# compiled separately (and concurrently, in separate checkouts or CI jobs).
# The stanzas below are generated by
#
#     python3 scripts/import_components.py BookProof --lakefile
#
# and each `roots` list is the set of maximal modules of one component, so
# `lake build <target>` builds exactly that component and nothing else.
# The remaining components consist of a single module, which is built directly
