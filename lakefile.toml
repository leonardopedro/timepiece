name = "RiemannProof"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PnpProof", "BookProof"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.28.0"

[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "verso-v4.28.0"

[[require]]
name = "MD4Lean"
git = "https://github.com/acmepjz/md4lean"
rev = "7e097e9a076d5fbe48aa39aceee871af0d011101"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "55c8532eb21ec9f6d565d51d96b8ca50bd1fbef3"

[[lean_lib]]
name = "UsedRoute"

[[lean_lib]]
name = "UnusedRoute"

[[lean_lib]]
name = "RandomMap"

[[lean_lib]]
name = "PnpProof"

[[lean_lib]]
name = "BookProof"

[[lean_lib]]
name = "Singularity"

[[lean_lib]]
name = "Book"

[[lean_exe]]
name = "book"
root = "BookMain"
