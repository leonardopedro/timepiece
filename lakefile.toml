# ---------------------------------------------------------------------------
# Sub-system targets: a *view* of one part (see BUILD_COMPONENTS.md).
#
# The derivative variables of a field, under both readings of the plan: the two
# chapters that adjoin each derivative as an independent canonical variable and
# gauge it back equal to that derivative (`u_{i,j}` for Navier-Stokes, the
# auxiliary `D_{mu nu}^i(k)` for gravity), and `ChapterNsFieldMomentumInverse`,
# which instead *solves* the derivative constraint for its mode (`pi^{-1}`) --
# the elimination route that replaced the gauge fixing -- together with the
# modules they rest on.  The sub-system cannot
# be a part of its own: its dependencies are shared with `BookProofOperatorCore`.
# Its cone is a subset of that part's cone, so `lake build BookProofDerivativeGauge`
# compiles less in one job than `lake build BookProofOperatorCore`, never more.
# Generated by the same command as the stanzas above.
# ---------------------------------------------------------------------------

[[lean_lib]]
name = "BookProofDerivativeGauge"
# sub-system target: 3 root(s), 192 modules in the cone
roots = ["BookProof.ChapterNsBrstDerivativeGauge", "BookProof.ChapterNsFieldMomentumInverse", "BookProof.ChapterQgBrstDerivativeGauge"]
