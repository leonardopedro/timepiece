name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Match the local checkout convention: the project is a Lean 4 book + proof tree
  # on the pinned 4.28.0 toolchain. Mathlib precompiled binaries are fetched to
  # avoid compiling mathlib from scratch.
  LEAN_VERSION: "4.28.0"

jobs:
  # ---------------------------------------------------------------------------
  # D.5: the H1 `verify-invariants` gate, in CI, behind a `.lean` path filter.
  #
  # Until 2026-10-05 this gate existed only as a script a human had to remember
  # to run. That is a documentation promise, not a gate: the G6 work order commit
  # recorded the gate as "unrun" rather than "passing", and silence was one
  # skipped command away from reading as green.
  #
  # The path filter is the point. `verify-invariants` pulls in a full Mathlib
  # build, which is minutes of CI for something a prose-only commit cannot
  # affect. So it runs when — and only when — a `.lean` file changed, plus on a
  # weekly schedule and on manual dispatch, so it cannot rot between Lean
  # touches. A documentation-only commit therefore stops being a special case,
  # and "the gate did not run" becomes an explainable fact rather than silence.
  #
  # It still does NOT run on every commit: that remains a known limit, recorded
  # in PROJECT_REVIEW_AND_IMPROVEMENT_PLAN.md §D.5.
  # ---------------------------------------------------------------------------
  verify-invariants:
    name: H1 verify-invariants (.lean changes, weekly, manual)
    runs-on: ubuntu-latest
    on:
      push:
        branches: [main]
        paths:
          - '**/*.lean'
          - 'scripts/verify-invariants'
      pull_request:
        paths:
          - '**/*.lean'
          - 'scripts/verify-invariants'
      schedule:
        # Monday 04:17 UTC. Deliberately not on the hour: every scheduled
        # workflow in every repo fires at :00, and the queue is worse there.
        - cron: '17 4 * * 1'
      workflow_dispatch:
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      - name: install elan (pinned 4.28.0)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C $HOME/.elan
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: elan toolchain
        run: elan toolchain install "$LEAN_VERSION"

      - name: fetch mathlib cache
        working-directory: .
        run: lake exe cache get

      - name: H1 gate
        run: bash scripts/verify-invariants

  # ---------------------------------------------------------------------------
  # X1: the shared-LaTeX drift gate, run from the *source of record* side.
  #
  # `book.tex` / `ODE.tex` live here and are mirrored into ../unfer, whose tests
  # read them by that path. The gate has to exist on both sides: unfer's CI
  # catches an edit made there, and this one catches the commoner case -- someone
  # editing the source and forgetting the mirror, which is invisible until
  # unfer's suite reads a stale copy.
  #
  # unfer is checked out as a sibling because the comparison needs both halves.
  # ---------------------------------------------------------------------------
  corpus-sync:
    name: book.tex / ODE.tex mirror in sync (X1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      - name: checkout unfer as sibling (mirror of the shared LaTeX corpus)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: source of record matches the unfer mirror
        run: bash scripts/check-book-sync

  # ---------------------------------------------------------------------------
  # Lean proof + certificate targets. These are pure-core & mathlib targets:
  #   - BookProof : the formalization (E_sum, RH, mass-gap chain, PME, ...)
  #   - Layout    : pure-core-Learn certificates for the GPU federation
  #   - Singularity : the ODE-singularity / ESA target
  # The Verso book is built in a separate job below (it takes longer and needs
  # the two tracked patches + postprocessing).
  # ---------------------------------------------------------------------------
  lean-proofs:
    name: lake build (BookProof + Layout + Singularity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install elan (pinned 4.28.0)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          # non-interactive; default toolchain from lean-toolchain
          bash /tmp/elan-init.sh -y >/dev/null
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: elan toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "${LEAN_VERSION}"

      - name: fetch mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || lake exe cache get

      - name: build default proof targets
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build BookProof Singularity Layout

  # ---------------------------------------------------------------------------
  # Verso book (single-page HTML) + KaTeX check. Wrapper applies the two tracked
  # Verso patches, renders, and post-processes (removes <base>), then verifies
  # every math snippet with throwOnError: true.
  # ---------------------------------------------------------------------------
  book:
    name: build + verify book (build-book.sh + check-katex.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install elan (pinned 4.28.0)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y >/dev/null
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: elan toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "${LEAN_VERSION}"

      - name: fetch mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || lake exe cache get

      - name: build + postprocess the book (patches + render + <base> removal)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          ./patches/build-book.sh

      - name: "verify every math snippet with throwOnError: true"
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          ./patches/check-katex.sh

  # ---------------------------------------------------------------------------
  # Doc-index freshness. One plain probe, one exit code — the `ax` /healthz
  # pattern (../ax, Apache-2.0) applied as CI, same shape as ../test's
  # site-check workflow. Python-stdlib only: DOC_INDEX.md + the versioned
  # state/doc_index.json must match a fresh rebuild (typos index discipline).
  # ---------------------------------------------------------------------------
  docs:
    name: doc index freshness (doc_index.py --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      - name: DOC_INDEX.md + state/doc_index.json fresh?
        run: python3 scripts/doc_index.py --check