# H1: the D.5 verify-invariants gate, as its own workflow.
#
# It used to live inside ci.yml with an `on:` nested in the *job* — which
# GitHub has no syntax for. The platform rejected the whole file
# ("(Line: 36, Col: 5): Unexpected value 'on'"), so every run of ci.yml,
# not just this gate, failed validation until the block moved to a workflow
# of its own, where triggers are legal. The job itself is unchanged.
#
# The path filter is the point. `verify-invariants` pulls in a full Mathlib
# build, which is minutes of CI for something a prose-only commit cannot
# affect. So it runs when — and only when — a `.lean` file changed, plus on
# a weekly schedule and on manual dispatch, so it cannot rot between Lean
# touches. A documentation-only commit therefore stops being a special case,
# and "the gate did not run" becomes an explainable fact rather than silence.
#
# It still does NOT run on every commit: that remains a known limit, recorded
# in PROJECT_REVIEW_AND_IMPROVEMENT_PLAN.md §D.5.
name: verify-invariants

on:
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'scripts/verify-invariants'
      # the workflow file itself: a change to this gate's own definition
      # must run the gate it defines.
      - '.github/workflows/verify-invariants.yml'
  pull_request:
    paths:
      - '**/*.lean'
      - 'scripts/verify-invariants'
      - '.github/workflows/verify-invariants.yml'
  schedule:
    # Monday 04:17 UTC. Deliberately not on the hour: every scheduled
    # workflow in every repo fires at :00, and the queue is worse there.
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  # Same pin as ci.yml: the project is a Lean 4 book + proof tree on the
  # pinned 4.28.0 toolchain. Mathlib precompiled binaries are fetched to
  # avoid compiling mathlib from scratch.
  LEAN_VERSION: "4.28.0"

jobs:
  verify-invariants:
    name: H1 verify-invariants (.lean changes, weekly, manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      - name: install elan (pinned 4.28.0)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.elan"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: elan toolchain
        run: elan toolchain install "$LEAN_VERSION"

      - name: fetch mathlib cache
        working-directory: .
        run: lake exe cache get

      - name: H1 gate
        run: bash scripts/verify-invariants
